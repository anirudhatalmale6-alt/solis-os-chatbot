<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solis OS Support Inbox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
.header { background: #f59e0b; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .badge { background: #fff; color: #f59e0b; border-radius: 12px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
.container { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 340px; background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; flex-shrink: 0; }
.conv-item { padding: 14px 16px; border-bottom: 1px solid #f3f4f6; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.conv-item:hover { background: #f9fafb; }
.conv-item.active { background: #fef3c7; }
.conv-item.needs-reply { border-left: 3px solid #f59e0b; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: #6b7280; flex-shrink: 0; }
.conv-item.needs-reply .avatar { background: #fef3c7; color: #d97706; }
.conv-info { flex: 1; min-width: 0; }
.conv-name { font-weight: 600; font-size: 15px; color: #1f2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-preview { font-size: 13px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.conv-time { font-size: 11px; color: #9ca3af; flex-shrink: 0; }
.conv-badge { background: #f59e0b; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 600; margin-top: 4px; }
.chat-area { flex: 1; display: flex; flex-direction: column; background: #f0f2f5; }
.chat-header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 10px; }
.chat-header-name { font-weight: 600; font-size: 16px; color: #1f2937; }
.chat-header-phone { font-size: 13px; color: #6b7280; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
.msg.inbound { background: #fff; align-self: flex-start; border: 1px solid #e5e7eb; }
.msg.outbound { background: #dcf8c6; align-self: flex-end; }
.msg .time { font-size: 10px; color: #9ca3af; margin-top: 4px; text-align: right; }
.reply-bar { background: #fff; padding: 10px 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: center; }
.reply-bar input { flex: 1; border: 1px solid #d1d5db; border-radius: 20px; padding: 10px 16px; font-size: 14px; outline: none; }
.reply-bar input:focus { border-color: #f59e0b; }
.reply-bar button { background: #f59e0b; color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.reply-bar button:hover { background: #d97706; }
.reply-bar button:disabled { background: #d1d5db; cursor: not-allowed; }
.empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 16px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.live { background: #f59e0b; animation: pulse 1.5s infinite; }
.status-dot.bot { background: #10b981; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@media (max-width: 700px) {
  .sidebar { width: 100%; }
  .container { flex-direction: column; }
  .chat-area { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; display: none; }
  .chat-area.open { display: flex; }
  .back-btn { display: block !important; cursor: pointer; font-size: 20px; margin-right: 4px; }
}
.back-btn { display: none; }
</style>
</head>
<body>
<div class="header">
  <div style="width:32px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;">
    <span style="font-size:18px;font-weight:800;color:#f59e0b;">S</span>
  </div>
  <h1>Support Inbox</h1>
  <span class="badge" id="liveCount">0</span>
</div>
<div class="container">
  <div class="sidebar" id="sidebar"></div>
  <div class="chat-area" id="chatArea">
    <div class="chat-header">
      <span class="back-btn" onclick="closeChat()">&#8592;</span>
      <div class="avatar" id="chatAvatar">?</div>
      <div>
        <div class="chat-header-name" id="chatName">Select a conversation</div>
        <div class="chat-header-phone" id="chatPhone"></div>
      </div>
      <div style="margin-left:auto;">
        <span class="status-dot" id="chatStatus"></span>
        <span id="chatStatusText" style="font-size:12px;color:#6b7280;margin-left:4px;"></span>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state">Select a conversation to start</div>
    </div>
    <div class="reply-bar" id="replyBar" style="display:none;">
      <input type="text" id="replyInput" placeholder="Type a reply..." onkeypress="if(event.key==='Enter')sendReply()">
      <button onclick="sendReply()" id="sendBtn">&#9654;</button>
    </div>
  </div>
</div>
<script>
let convos = [];
let activePhone = null;
let refreshTimer = null;

async function loadConversations() {
  try {
    const r = await fetch('/api/admin/leads');
    const data = await r.json();
    convos = data.conversations || [];
    renderSidebar();
    if (activePhone) renderChat(activePhone);
    const liveCount = convos.filter(c => c.handedOff).length;
    document.getElementById('liveCount').textContent = liveCount;
  } catch(e) { console.error(e); }
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  if (convos.length === 0) { sb.innerHTML = '<div class="empty-state">No conversations yet</div>'; return; }
  sb.innerHTML = convos.map(c => {
    const last = c.messages[c.messages.length - 1];
    const preview = last ? (last.direction === 'outbound' ? 'You: ' : '') + last.text.substring(0, 50) : '';
    const time = last ? new Date(last.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    const initial = (c.name || '?')[0].toUpperCase();
    const needsReply = c.handedOff ? 'needs-reply' : '';
    const active = c.phone === activePhone ? 'active' : '';
    return `<div class="conv-item ${needsReply} ${active}" onclick="openChat('${c.phone}')">
      <div class="avatar">${initial}</div>
      <div class="conv-info">
        <div class="conv-name">${c.name || c.phone}</div>
        <div class="conv-preview">${preview}</div>
        ${c.handedOff ? '<span class="conv-badge">WAITING FOR REPLY</span>' : ''}
      </div>
      <div style="text-align:right;">
        <div class="conv-time">${time}</div>
      </div>
    </div>`;
  }).join('');
}

function openChat(phone) {
  activePhone = phone;
  const chatArea = document.getElementById('chatArea');
  chatArea.classList.add('open');
  renderChat(phone);
  renderSidebar();
}

function closeChat() {
  activePhone = null;
  document.getElementById('chatArea').classList.remove('open');
  renderSidebar();
}

function renderChat(phone) {
  const c = convos.find(x => x.phone === phone);
  if (!c) return;
  const initial = (c.name || '?')[0].toUpperCase();
  document.getElementById('chatAvatar').textContent = initial;
  document.getElementById('chatName').textContent = c.name || 'Unknown';
  document.getElementById('chatPhone').textContent = '+' + phone;
  const statusDot = document.getElementById('chatStatus');
  const statusText = document.getElementById('chatStatusText');
  if (c.handedOff) {
    statusDot.className = 'status-dot live';
    statusText.textContent = 'Waiting for you';
  } else {
    statusDot.className = 'status-dot bot';
    statusText.textContent = 'Bot active';
  }
  const msgDiv = document.getElementById('messages');
  msgDiv.innerHTML = c.messages.map(m => {
    const time = new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return `<div class="msg ${m.direction}">
      ${m.text}
      <div class="time">${time}</div>
    </div>`;
  }).join('');
  msgDiv.scrollTop = msgDiv.scrollHeight;
  document.getElementById('replyBar').style.display = 'flex';
  document.getElementById('replyInput').focus();
}

async function sendReply() {
  const input = document.getElementById('replyInput');
  const text = input.value.trim();
  if (!text || !activePhone) return;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  input.value = '';
  try {
    const r = await fetch('/api/admin/reply', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ phone: activePhone, message: text })
    });
    if (r.ok) {
      await loadConversations();
    } else {
      alert('Failed to send message');
    }
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false;
  input.focus();
}

loadConversations();
refreshTimer = setInterval(loadConversations, 5000);
</script>
</body>
</html>
